[build]
  command = "node generate-site-data.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/site-data.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
